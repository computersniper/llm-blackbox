# 揭开黑箱（/blackbox/）的 nginx 片段：静态文本资源压缩 + 带版本号资源的长缓存。
# 安装位置：/etc/nginx/snippets/blackbox.conf，在 www.caijiechao.com 的 443 server 块里 include。
# 这里不用 add_header（否则会让 server 级的安全头失效），只用 gzip_* 和 expires。
location ^~ /blackbox/ {
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain;
    try_files $uri $uri/ =404;

    # 页面里对 JS / CSS / 字体的引用都由 tools/stamp.sh 加了 ?v=<commit>，发布新版本时 URL 会变
    location ~* \.(?:js|css|woff2)$ {
        expires 30d;
    }
    # 数据文件不带版本号，只做协商缓存（ETag / Last-Modified），发布后立刻生效
}
