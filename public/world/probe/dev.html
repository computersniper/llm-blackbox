<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>世界地图探针 · 开发页</title>
<link rel="icon" href="../../favicon.svg">
<link rel="stylesheet" href="../../css/app.css">
<style>
  /* 开发用的独立页面：单独测试 mountProbe（正式页面由 world/ 挂载） */
  html, body { height: auto; min-height: 100%; }
  body { overflow: auto; background: var(--bg); }
  .dev { display: grid; grid-template-columns: minmax(0, 900px) minmax(260px, 340px); gap: 18px; justify-content: center; padding: 22px 18px 28px; }
  .dev-h { grid-column: 1 / -1; display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .dev-h h1 { margin: 0; font-family: var(--serif); font-weight: 600; font-size: 22px; }
  .dev-h span { color: var(--dim); font-size: 12.5px; }
  .dev-box { height: 600px; }
  .dev-side { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .dev-ex { flex: 1; min-height: 0; max-height: 600px; overflow-y: auto; padding: 14px 16px; border-radius: 14px; border: 1px solid var(--line2); background: var(--panel); font-size: 13.5px; line-height: 1.75; color: var(--ink2); scrollbar-width: thin; scrollbar-color: var(--line2) transparent; }
  .dev-ex p { margin: 0 0 10px; }
  .dev-ex b { color: var(--ink); }
  .dev-ex .dim { color: var(--dim); font-size: 12.5px; }
  .dev-ex code { font-family: var(--mono); font-size: 12px; color: var(--c-x); }
  .dev-ctl { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--dim); }
  .dev-ctl button, .dev-ctl input { height: 28px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line2); background: rgba(255, 255, 255, .03); color: var(--ink2); font: inherit; cursor: pointer; }
  .dev-ctl input { width: 64px; cursor: text; }
  /* 英文模式：拉丁字体排在中文字体前面（和 world.css 同一条规则） */
  html[lang="en"] { --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Liberation Sans", "DejaVu Sans", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif; }
  @media (max-width: 900px) {
    .dev { grid-template-columns: minmax(0, 1fr); padding: 12px 15px 20px; gap: 12px; }
    .dev-box { height: 420px; }
    .dev-ex { max-height: none; }
  }
</style>
</head>
<body>
<main class="dev">
  <header class="dev-h"><h1 data-i18n="dev.h1">大模型里的世界地图</h1><span data-i18n="dev.sub">开发页 · 单独测试 probe/probe.js 的 mountProbe()</span><span id="langSwitch"></span></header>
  <div class="dev-box" id="box"></div>
  <aside class="dev-side">
    <div class="dev-ctl">
      <span data-i18n="dev.ext">外部调试器：</span>
      <input id="lay" type="number" min="0" max="27" value="12" aria-label="层" data-i18n-attr="aria-label:dev.layer">
      <button id="set">setLayer</button>
      <button id="kill">destroy</button>
      <button id="again" data-i18n="dev.again">重新挂载</button>
    </div>
    <div class="dev-ex" id="ex" aria-live="polite"></div>
  </aside>
</main>
<script type="module">
  import { mountProbe } from './probe.js';
  import { isEn, L, addDict, applyDom, mountLangSwitch } from '../../js/i18n.js';
  addDict({
    zh: { 'dev.h1': '大模型里的世界地图', 'dev.sub': '开发页 · 单独测试 probe/probe.js 的 mountProbe()', 'dev.ext': '外部调试器：', 'dev.layer': '层', 'dev.again': '重新挂载' },
    en: { 'dev.h1': 'The world map inside an LLM', 'dev.sub': 'Dev page · tests mountProbe() from probe/probe.js on its own', 'dev.ext': 'External debugger:', 'dev.layer': 'Layer', 'dev.again': 'Remount' },
  });
  applyDom();
  mountLangSwitch(document.getElementById('langSwitch'));
  if (isEn) document.title = 'World map probe · dev page';
  const box = document.getElementById('box'), ex = document.getElementById('ex');
  let api = null;
  async function mount() {
    api?.destroy();
    api = await mountProbe(box, { onExplain: (html) => { ex.innerHTML = html; } });
    window.__probe = api;
  }
  document.getElementById('set').onclick = () => api?.setLayer(Number(document.getElementById('lay').value));
  document.getElementById('kill').onclick = () => { api?.destroy(); api = null; ex.innerHTML = `<p class="dim">${L('已销毁', 'Destroyed')}</p>`; };
  document.getElementById('again').onclick = mount;
  mount();
</script>
</body>
</html>
