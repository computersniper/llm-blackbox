<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>多模态模型 · 看 AI 如何理解图像</title>
  <meta name="description" content="探索真实的 Qwen 视觉模型如何将图像切块、转换为词元，并在生成每个字时关注图像的不同区域。">
  <meta name="theme-color" content="#060d1a">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="preload" href="../fonts/jetbrains-mono-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../css/app.css?v=1">
  <link rel="stylesheet" href="css/multimodal.css?v=1">
</head>
<body>
  <canvas id="bg" aria-hidden="true"></canvas>
  <div class="grain" aria-hidden="true"></div>

  <header class="topbar">
    <a class="brand" href="../" aria-label="揭开黑箱">
      <span class="brand-cube" aria-hidden="true"><i></i><i></i><i></i></span>
      <span class="brand-en">BLACK&nbsp;BOX</span>
      <span class="brand-zh">揭开黑箱</span>
    </a>
    <nav class="top-nav" id="navTabs" aria-label="主导航">
      <a href="../">推理</a>
      <a href="../training/">训练</a>
      <a href="./" class="active">多模态</a>
      <a href="../agent/">智能体</a>
    </nav>
    <div class="top-actions">
      <button class="hud-btn" id="btnSound" type="button" aria-pressed="false" title="打开声音">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path class="wave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path class="mute" d="M16.5 9.5l5 5m0-5l-5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
    </div>
  </header>

  <div class="mm-app">
    <section class="mm-sidebar">
      <div class="mm-sidebar-content">
        <div class="mm-title">
          <h1>多模态模型</h1>
          <p>看 AI 如何理解图像</p>
        </div>

        <div class="mm-section">
          <h3>选择示例</h3>
          <div class="mm-examples" id="examples"></div>
        </div>

        <div class="mm-section">
          <h3>提问</h3>
          <div class="mm-question" id="question">图片里有什么？</div>
        </div>

        <div class="mm-section">
          <h3>模型回答</h3>
          <div class="mm-response" id="response"></div>
          <div class="mm-controls">
            <button class="mm-btn" id="btnPlay" type="button" title="播放">▶</button>
            <button class="mm-btn" id="btnPrev" type="button" title="上一个字">‹</button>
            <button class="mm-btn" id="btnNext" type="button" title="下一个字">›</button>
            <div class="mm-progress">
              <span id="charPos">0</span> / <span id="charTotal">0</span>
            </div>
          </div>
        </div>

        <div class="mm-section">
          <h3>当前关注</h3>
          <div class="mm-info" id="attnInfo">
            <p class="dim">播放时会显示模型在生成每个字时关注图像的哪些区域</p>
          </div>
        </div>
      </div>
    </section>

    <section class="mm-stage">
      <div class="mm-canvas-wrap">
        <canvas id="imageCanvas"></canvas>
        <div id="patchOverlay" class="patch-overlay"></div>
      </div>
      <div class="stage-label" id="stageLabel">图像切块</div>
      <div class="mm-stage-controls">
        <button class="view-btn active" data-view="patches">切块视图</button>
        <button class="view-btn" data-view="tokens">词元视图</button>
        <button class="view-btn" data-view="attention">注意力视图</button>
      </div>
    </section>
  </div>

  <div id="tooltip" role="tooltip"></div>

  <noscript><p class="noscript">这个网站需要 JavaScript 才能运行。</p></noscript>
  <script type="module" src="js/multimodal.js?v=1"></script>
</body>
</html>
