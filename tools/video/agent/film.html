<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <!-- 站点脚本里的 fetch('data/...') 是相对路径：把基准地址指到 /public/agent/，自己的文件一律用绝对路径 -->
  <base href="/public/agent/">
  <title>只会写字的 AI，怎么自己动手干活 · 电影模式</title>
  <link rel="stylesheet" href="/tools/video/agent/film.css">
  <script>
    // 确定性：Math.random 换成固定种子的伪随机数，每次渲染完全一样
    (() => {
      let s = 0x2545f491;
      Math.random = () => {
        s |= 0; s = (s + 0x6d2b79f5) | 0;
        let t = Math.imul(s ^ (s >>> 15), 1 | s);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    })();
  </script>
</head>
<body>
  <div id="frame">
    <canvas id="bg" width="1920" height="1080"></canvas>
    <div id="loop"></div>
    <div id="desk"></div>
    <div id="panels"></div>
    <div id="fade"></div>
    <div id="vignette"></div>
    <div id="ov"></div>
    <canvas id="grain" width="480" height="270"></canvas>
  </div>
  <div id="scrub" hidden><input type="range" id="scrubber" min="0" max="190" step="0.01" value="0"><span id="scrubT"></span></div>
  <script type="module" src="/tools/video/agent/film.js"></script>
</body>
</html>
