<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <!-- 站点脚本里的 fetch('data/...') 是相对路径：把基准地址指到 /public/，自己的文件一律用绝对路径 -->
  <base href="/public/">
  <title>AI 的一个字是怎么思考出来的 · 电影模式</title>
  <link rel="stylesheet" href="/tools/video/film.css">
  <link rel="stylesheet" href="/tools/video/board.css">
  <script>
    // 确定性：Math.random 换成固定种子的伪随机数（机器里的漂浮微粒等会用到），每次渲染完全一样
    (() => {
      let s = 0x9e3779b9;
      Math.random = () => {
        s |= 0; s = (s + 0x6d2b79f5) | 0;
        let t = Math.imul(s ^ (s >>> 15), 1 | s);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    })();
  </script>
</head>
<body>
  <div id="frame">
    <div id="gl"></div>
    <!-- 压暗只压 3D 画面；字幕、片名、片尾在它上面，不受影响 -->
    <div id="fade"></div>
    <div id="vignette"></div>
    <div id="ov"></div>
    <canvas id="grain" width="480" height="270"></canvas>
  </div>
  <div id="scrub" hidden><input type="range" id="scrubber" min="0" max="215" step="0.01" value="0"><span id="scrubT"></span></div>
  <script type="module" src="/tools/video/film.js"></script>
</body>
</html>
